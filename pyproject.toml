[project]
name = "athlytics"
version = "0.1.0"
description = "Self-hosted personal health and fitness analytics platform"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0",
    "python-dotenv>=1.0",
    "garminconnect>=0.2.31",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "mcp>=2.0,<3.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "setuptools>=68"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "app*", "mcp_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
