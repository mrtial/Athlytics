[project]
name = "athlytics"
version = "0.1.0"
description = "Self-hosted personal health and fitness analytics platform"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
