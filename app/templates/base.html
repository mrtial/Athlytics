<!doctype html>
<html lang="en" data-theme="{{ theme|default('light') }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Athlytics — AI Health &amp; Fitness Analytics{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script>
    (function() {
      const serverTheme = "{{ theme|default('') }}";
      if (serverTheme) {
        document.documentElement.setAttribute("data-theme", serverTheme);
        localStorage.setItem("athlytics_theme", serverTheme);
      } else {
        const localTheme = localStorage.getItem("athlytics_theme");
        if (localTheme) document.documentElement.setAttribute("data-theme", localTheme);
      }
    })();
  </script>
</head>
<body>
  <header class="app-header">
    <a href="/dashboard" class="brand-container">
      <div class="app-icon">✱</div>
      <span class="app-title">Athlytics</span>
    </a>
    {% if authenticated %}
    <nav class="header-nav">
      <a href="/dashboard" class="nav-link">Dashboard</a>
      <a href="/settings" class="nav-link">Settings</a>
      <button type="button" class="btn-nav-sync" onclick="triggerManualSync(event)">
        <span>⚡</span> Sync Data
      </button>
      <form method="post" action="/logout" class="inline-form">
        <button type="submit" class="btn-logout">Log out</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
