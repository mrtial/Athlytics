<!doctype html>
<html lang="en" data-theme="{{ theme|default('light') }}" data-skin="{{ skin|default('lime') }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Athlytics — AI Health &amp; Fitness Analytics{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v={{ static_version }}">
  <script>
    (function() {
      const serverTheme = "{{ theme|default('') }}";
      if (serverTheme) {
        document.documentElement.setAttribute("data-theme", serverTheme);
        localStorage.setItem("athlytics_theme", serverTheme);
      } else {
        const localTheme = localStorage.getItem("athlytics_theme");
        if (localTheme) document.documentElement.setAttribute("data-theme", localTheme);
      }

      const serverSkin = "{{ skin|default('') }}";
      if (serverSkin) {
        document.documentElement.setAttribute("data-skin", serverSkin);
        localStorage.setItem("athlytics_skin", serverSkin);
      } else {
        const localSkin = localStorage.getItem("athlytics_skin");
        if (localSkin) document.documentElement.setAttribute("data-skin", localSkin);
      }
    })();
  </script>
</head>
<body>
  <header class="app-header">
    <a href="/dashboard" class="brand-container">
      <div class="app-icon">✱</div>
      <span class="app-title">Athlytics</span>
    </a>
    {% if authenticated %}
    <nav class="header-nav">
      <a href="/dashboard" class="nav-link{% if active_page == 'dashboard' %} active{% endif %}">Dashboard</a>
      <a href="/connections" class="nav-link{% if active_page == 'connections' %} active{% endif %}">Connections</a>
      <a href="/activities" class="nav-link{% if active_page == 'activities' %} active{% endif %}">Activities</a>
      <a href="/coach" class="nav-link{% if active_page == 'coach' %} active{% endif %}">Coach</a>
      <a href="/training-plans" class="nav-link{% if active_page == 'training_plans' %} active{% endif %}">Training Plans</a>

      <div class="range-toggle nav-theme-toggle" id="theme-toggle-group">
        <button type="button" class="range-btn theme-toggle-btn{% if theme != 'dark' %} is-active{% endif %}" data-theme-value="light" aria-label="Light mode">{{ feather_icon('sun') }}</button>
        <button type="button" class="range-btn theme-toggle-btn{% if theme == 'dark' %} is-active{% endif %}" data-theme-value="dark" aria-label="Dark mode">{{ feather_icon('moon') }}</button>
      </div>

      <!-- Athlete User Chip Dropdown Menu -->
      <div class="user-chip-dropdown-wrapper">
        <button type="button" class="athlete-nav-chip" onclick="toggleUserDropdown(event)" id="user-chip-btn" aria-haspopup="true" aria-expanded="false">
          <div class="athlete-avatar-mini">
            {{ (athlete_name[:2] if athlete_name else 'CY')|upper }}
          </div>
          <div class="athlete-nav-meta">
            <span class="athlete-nav-name">{{ athlete_name|default('Charlie Yang') }}</span>
            <span class="athlete-nav-sub">{% if athlete_age %}Age {{ athlete_age }} &bull; {% endif %}{{ (persona or current_persona or 'Athlete')|replace('_', ' ')|title }}</span>
          </div>
          {{ feather_icon('chevron-down', 'dropdown-chevron') }}
        </button>

        <div class="user-dropdown-menu" id="user-dropdown-menu">
          <a href="/settings" class="dropdown-item">Settings</a>
          <div class="dropdown-divider"></div>
          <form method="post" action="/logout" class="dropdown-form">
            <button type="submit" class="dropdown-item logout-item">Log out</button>
          </form>
        </div>
      </div>
    </nav>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="/static/charts.js?v={{ static_version }}"></script>
  <script src="/static/app.js?v={{ static_version }}"></script>
</body>
</html>
