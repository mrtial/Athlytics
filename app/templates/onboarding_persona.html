{% extends "base.html" %}
{% block title %}Choose a Persona — Athlytics{% endblock %}
{% block content %}
<div class="auth-wrapper auth-wrapper-onboarding">
  <div class="auth-card">
    {% include "partials/onboarding_steps.html" %}
    <div class="auth-content-narrow">
      <div class="auth-header">
        <div class="app-icon">🏃‍♂️</div>
        <h1 class="auth-title">Select Your Persona</h1>
        <p class="auth-subtitle">Step 3 of 5 &bull; Customizes your primary dashboard widgets</p>
      </div>

      {% if error %}
      <div class="error-banner">{{ error }}</div>
      {% endif %}

      <form method="post" action="/onboarding/persona">
        <div class="option-tiles-group">
          <label class="option-tile">
            <input type="radio" name="persona" value="endurance_runner" required>
            <div>
              <div style="font-weight: 700; font-size: 0.95rem;">🏃 Endurance Runner</div>
              <div style="font-size: 0.8rem; color: var(--fg-muted); margin-top: 0.15rem;">VO2 Max, HRV, Pace &amp; Race Predictions</div>
            </div>
          </label>

          <label class="option-tile">
            <input type="radio" name="persona" value="strength_general_fitness">
            <div>
              <div style="font-weight: 700; font-size: 0.95rem;">🏋️ Strength &amp; General Fitness</div>
              <div style="font-size: 0.8rem; color: var(--fg-muted); margin-top: 0.15rem;">Workouts, Calories, Steps &amp; Training Load</div>
            </div>
          </label>

          <label class="option-tile">
            <input type="radio" name="persona" value="sleep_recovery_focus">
            <div>
              <div style="font-weight: 700; font-size: 0.95rem;">🌙 Sleep &amp; Recovery Focus</div>
              <div style="font-size: 0.8rem; color: var(--fg-muted); margin-top: 0.15rem;">Sleep Score, HRV, Body Battery &amp; Stress</div>
            </div>
          </label>

          <label class="option-tile">
            <input type="radio" name="persona" value="full_overview">
            <div>
              <div style="font-weight: 700; font-size: 0.95rem;">📊 Full Overview</div>
              <div style="font-size: 0.8rem; color: var(--fg-muted); margin-top: 0.15rem;">All 18 health and training performance metrics</div>
            </div>
          </label>
        </div>

        <button type="submit" class="btn-primary">
          <span>Continue to Theme</span>
          <span>→</span>
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
