{% extends "base.html" %}
{% block title %}Choose a Theme — Athlytics{% endblock %}
{% block content %}
<h1>Choose a visual theme</h1>
<p>Independent of persona. Changeable later from Settings.</p>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/onboarding/theme">
  <label><input type="radio" name="theme" value="light" required> Light</label><br>
  <label><input type="radio" name="theme" value="dark"> Dark</label><br>
  <button type="submit">Continue</button>
</form>
{% endblock %}
