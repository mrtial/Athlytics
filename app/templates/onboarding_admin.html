{% extends "base.html" %}
{% block title %}Create Admin Account — Athlytics{% endblock %}
{% block content %}
<div class="auth-wrapper auth-wrapper-onboarding">
  <div class="auth-card">
    {% include "partials/onboarding_steps.html" %}
    <div class="auth-content-narrow">
      <div class="auth-header">
        <div class="app-icon">✱</div>
        <h1 class="auth-title">Create Admin Account</h1>
        <p class="auth-subtitle">Step 1 of 5 &bull; Single-tenant, self-hosted setup</p>
      </div>

      {% if error %}
      <div class="error-banner">{{ error }}</div>
      {% endif %}

      <form method="post" action="/onboarding/admin" id="admin-onboarding-form">
        <div class="form-group">
          <label class="form-label">Protect your data with a login?</label>
          <div class="range-toggle" id="protect-toggle-group">
            <button type="button" class="range-btn protect-toggle-btn is-active" data-protect-value="yes">Yes, add a password</button>
            <button type="button" class="range-btn protect-toggle-btn" data-protect-value="no">No, skip this</button>
          </div>
          <input type="hidden" name="protect" id="protect-value" value="yes">
        </div>

        <div id="protect-fields">
          <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input class="form-input" type="text" id="username" name="username" placeholder="Choose a username" required autofocus>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password (min 8 chars)</label>
            <input class="form-input" type="password" id="password" name="password" placeholder="Create a secure password" required minlength="8">
          </div>
        </div>

        <button type="submit" class="btn-primary">
          <span>Continue</span>
          <span>→</span>
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
