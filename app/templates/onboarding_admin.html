{% extends "base.html" %}
{% block title %}Create Admin Account — Athlytics{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="app-icon">✱</div>
      <h1 class="auth-title">Create Admin Account</h1>
      <p class="auth-subtitle">Step 1 of 4 &bull; Single-tenant, self-hosted setup</p>
    </div>

    {% if error %}
    <div class="error-banner">{{ error }}</div>
    {% endif %}

    <form method="post" action="/onboarding/admin">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input class="form-input" type="text" id="username" name="username" placeholder="Choose a username" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password (min 8 chars)</label>
        <input class="form-input" type="password" id="password" name="password" placeholder="Create a secure password" required minlength="8">
      </div>

      <button type="submit" class="btn-primary">
        <span>Create Account</span>
        <span>→</span>
      </button>
    </form>
  </div>
</div>
{% endblock %}
